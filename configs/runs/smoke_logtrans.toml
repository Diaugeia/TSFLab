# Smoke run for LogTrans on the tiny built-in smoke dataset (CPU, 1 epoch).
extends = ["../base.toml", "../fixtures/smoke.toml", "../models/LogTrans.toml"]

[experiment]
description = "Smoke: LogTrans"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "nll_gaussian"
patience = 1

[evaluation]
metrics = ["crps", "wql", "coverage_80", "width_80", "mae", "mse"]

[model.params]
enc_in = 6
d_model = 32
n_heads = 4
e_layers = 2
d_ff = 64
