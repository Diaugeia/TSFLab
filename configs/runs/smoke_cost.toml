# Smoke run for CoST on the tiny built-in smoke dataset (CPU): short pre-training, then the ridge fit.
extends = ["../base.toml", "../fixtures/smoke.toml", "../models/CoST.toml"]

[experiment]
description = "Smoke: CoST"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mse"
patience = 1

[model.params]
enc_in = 6
repr_dims = 64
hidden_dims = 16
depth = 3
pretrain_iters = 5
pretrain_batch_size = 16
