paper = "https://arxiv.org/abs/2401.13968"
code = "https://github.com/anwarmaxsum/MANTRA"
revision = "a204652a"
reason = "unfaithful"
summary = "The released pipeline does not implement the paper, and the fusion of slow and fast learners is undefined when seq_len differs from pred_len."
issues = [
  { kind = "paper-code-mismatch", what = "The slow learner is trained but never feeds the forecast; the Eq. 9 fusion exists only as commented-out code." },
