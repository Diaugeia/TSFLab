  { kind = "code-bug", what = "The URT layer reshapes [M,O,C] to [M,C,O] instead of transposing; a stale-gradient double `model_optim.step()`; hard-coded `.cuda()`." },
  { kind = "paper-error", what = "The batch-mean URT query mixes forecasts across overlapping test windows." },
  { kind = "license", what = "The only license file, `code/LICENSE`, is THUML's MIT notice copied from Autoformer." },
]

