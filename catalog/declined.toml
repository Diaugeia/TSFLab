# Papers reviewed for the model catalog and declined.
#
# Each entry records why the paper is not a catalog model and what the review of
# the paper and its official code found. `reason` is one of: out-of-scope (the
# method is not a forecaster under TSFLab's task modes), unfaithful (it cannot be
# implemented without inventing defining operations), composite (it orchestrates
# other pretrained models), or duplicate (its network is already cataloged).
# Issue kinds are those of model-card `## Upstream issues`
# (src/tsflab/catalog/cards/issues.py). `tsf model issues --summary` counts them.

[[paper]]
name = "CPLoss"
title = "CP Loss: Channel-wise Perceptual Loss for Time Series Forecasting"
paper = "https://arxiv.org/abs/2601.18829"
code = "https://github.com/zyh16143998882/CP_Loss"
revision = "000b91050fa8cd1ba691f2289dfbe4d305fa29f2"
reason = "unfaithful"
summary = "The perceptual filter's down/up-sampling operators, initialization, padding, and level semantics are unspecified, and no code was released."
issues = [
  { kind = "unreleased", what = "The repository holds only a README; no code or license." },
  { kind = "underspecified", what = "Perceptual filter operators, initialization, padding and level semantics are not defined; each choice changes the loss." },
]

[[paper]]
name = "UEC"
title = "Reviving Error Correction in Modern Deep Time-Series Forecasting"
paper = "https://arxiv.org/abs/2605.21088"
code = "https://github.com/DA2I2-SLM/UEC-STD"
revision = "ee227993"
reason = "out-of-scope"
summary = "The corrector is trained after the frozen backbone on the validation split and its strength is tuned on a validation/training mix; the training contract has no such stage, and training it on the backbone's own training data is what the paper rejects."
issues = []

