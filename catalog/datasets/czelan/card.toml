license = "CC-BY-4.0 (SAPFLUXNET Zenodo record)"
license_url = "https://doi.org/10.5281/zenodo.3971689"
redistribution = "hosted"

[shape]
frequency = "30 minutes (30min)"
time_span = "2016-05-06 00:11:03 to 2017-06-25 06:41:03"
length = 19934
channels = 11
channel_kind = "channels"
target = "CZE_LAN_Cbe_Jt_16 (sap flow of one plant, the first channel; the preset names it explicitly)"
