schema = "tsflab.card/1"
kind = "dataset"
name = "czelan"
domain = "environment"
topic = "ecophysiology"
benchmarks = ["tfb"]
tags = ["sap-flow", "transpiration", "sapfluxnet", "ecology", "plant", "meteorology", "half-hourly", "tfb", "multivariate", "czelan", "diurnal"]
