schema = "tsflab.card/1"
kind = "dataset"
name = "pems_bay"
domain = "transport"
topic = "road traffic"
benchmarks = ["tfb", "st-graph"]
tags = ["traffic", "graph", "spatiotemporal", "5min", "california", "sensors", "adjacency", "benchmark", "nodes", "pems_bay", "speed", "bay-area", "dcrnn", "pems-bay"]
related = ["metr_la", "pems04", "rt/traffic_pems_ba"]
characteristics = ["weak-seasonality", "heavy-tails", "outliers", "low-dimensional-channels", "weak-cross-correlation", "many-channels", "spatial-graph"]
characteristics_basis = "measured by tsf data analyze (tsflab.dataset-profile/1, decision-safe train/val metrics, thresholds in profile_rules.toml) on 2026-10-03"

[source]
name = "Caltrans PeMS; packaged by Li, Yu, Shahabi and Liu (DCRNN)"
url = "https://github.com/liyaguang/DCRNN"
citation = "Diffusion Convolutional Recurrent Neural Network: Data-Driven Traffic Forecasting (Li et al., ICLR 2018)"
citation_url = "https://arxiv.org/abs/1707.01926"
license = "Public domain (Caltrans PeMS conditions of use)"
license_url = "https://pems.dot.ca.gov/?view=tou"
redistribution = "hosted"

[shape]
frequency = "5-minute (5min)"
time_span = "2017-01-01 to about 2017-06-30 (52,116 steps; the DCRNN paper text says to 2017-05-31)"
length = 52116
channels = 325
channel_kind = "nodes"
target = "traffic speed"
missing_values = "no NaN in the DCRNN file; 12 steps are absent at the 2017-03-12 daylight-saving change (52,116 = 181 days x 288 - 12)"
stats_basis = "source-reported"

[protocol]
protocol = "TSFLab: chronological 7:1:2 split, values unscaled by default (scale = false, calendar covariates kept raw); lookback 12, horizons 12"
literature = "DCRNN: 12 steps in, 12 steps out (reported at 15/30/60 minutes), chronological 7:1:2, masked MAE/RMSE/MAPE"
split = "7:1:2"
seq_lens = [12]
pred_lens = [12]
