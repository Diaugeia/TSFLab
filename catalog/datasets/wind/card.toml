schema = "tsflab.card/1"
kind = "dataset"
name = "wind"
domain = "energy"
topic = "wind power"
benchmarks = ["tfb"]
tags = ["wind", "wind-power", "renewable", "energy", "nwp", "weather-forecast", "15-minute", "tfb", "multivariate", "paddlespatial", "d3vae"]
related = ["solar", "weather", "etth1"]
characteristics = ["weak-seasonality", "train-val-level-shift", "regime-changes", "weak-cross-correlation"]
characteristics_basis = "measured by tsf data analyze (tsflab.dataset-profile/1, decision-safe train/val metrics, thresholds in profile_rules.toml) on 2026-10-03"

[source]
name = "PaddleSpatial WindPower dataset collected for D3VAE (Li et al., NeurIPS 2022); wind farm not named; TFB packaging by Qiu et al."
url = "https://github.com/PaddlePaddle/PaddleSpatial/tree/main/paddlespatial/datasets/WindPower"
citation = "Generative Time Series Forecasting with Diffusion, Denoise, and Disentanglement (Li et al., NeurIPS 2022)"
citation_url = "https://arxiv.org/abs/2301.03028"
license = "CC-BY-4.0 (SDWPF dataset)"
license_url = "https://figshare.com/articles/dataset/SDWPF_dataset/24798654"
redistribution = "hosted"

[shape]
frequency = "15 minutes (15min)"
time_span = "2020-01-01 00:00 to 2021-05-22 00:00"
length = 48673
channels = 7
channel_kind = "channels"
target = "target (wind power output, the last channel; the preset names it explicitly)"
missing_values = "none (no NaN, no timestamp gaps); `target` is negative in 6,050 steps (to -0.95) and 0 in 228"
stats_basis = "measured"

[protocol]
protocol = "TSFLab: chronological 7:1:2 split, scaling fitted on the training split only; lookback 96/336/512, horizons 96/192/336/720"
literature = "TFB multivariate: lookback 96, 336 or 512, horizons 96/192/336/720, chronological 7:1:2 (TFB `train_ratio_in_tv` default 0.875 with `tv_ratio` 0.8)"
split = "7:1:2"
seq_lens = [96, 336, 512]
pred_lens = [96, 192, 336, 720]
