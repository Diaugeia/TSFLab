# Execution policy: pilot and smoke (light datasets) of the 1.0 static benchmark on UH_Public (8x RTX 6000 Ada 48 GB, 224 cores).
#   uv run tsf run <run.toml> --policy experiments/benchmark-1.0/scripts/policy-pilot.toml \
#       --gpus 0,1,2,3,4,5,6,7 --jobs 24
# Measures per-model time and peak memory; nothing here changes a result.

[budget]
max_parallel_jobs = 24      # overridden by --jobs
run_timeout_minutes = 120   # a pilot cell (ETTh1 96->96, PEMS08 12->12) longer than this is reported
max_retries = 0             # the pilot reports failures as they are

[resources]
gpus = ["0", "1", "2", "3", "4", "5", "6", "7"]
gpus_per_run = 1
sharing = true              # cooperative packing; reservations, not memory isolation
max_processes_per_gpu = 3
memory_per_run_mb = 12000   # declared peak; the pilot measures the real one
min_free_memory_mb = 4000
threads_per_run = 6         # 24 runs x 6 threads stays under 224 cores
wait_timeout_minutes = 1440
min_free_disk_gb = 100

[storage]
keep_epoch_checkpoints = 0  # best checkpoint only
