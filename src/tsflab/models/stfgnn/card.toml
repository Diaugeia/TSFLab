schema = "tsflab.card/1"
kind = "model"
name = "STFGNN"
tags = ["gnn", "cnn", "spatiotemporal", "graph-given", "dtw-graph", "fusion-graph", "glu", "traffic", "training-objective"]
fits = ["spatial-graph"]
fidelity = "reference-checked"

[paper]
title = "Spatial-Temporal Fusion Graph Neural Networks for Traffic Flow Forecasting"
url = "https://arxiv.org/abs/2012.09641"
venue = "AAAI 2021"
year = 2021

[code]
url = "https://github.com/MengzhangLI/STFGNN"
revision = "a02feee56fbb04d6cabb8f04f625948072fa9583"
license = "NOASSERTION"
reference_sources = ["https://github.com/MengzhangLI/STFGNN/blob/a02feee56fbb04d6cabb8f04f625948072fa9583/models/stsgcn_4n_res.py", "https://github.com/MengzhangLI/STFGNN/blob/a02feee56fbb04d6cabb8f04f625948072fa9583/utils_4n0_3layer_12T_res.py", "https://github.com/MengzhangLI/STFGNN/blob/a02feee56fbb04d6cabb8f04f625948072fa9583/main_4n0_3layer_12T_res.py", "https://github.com/MengzhangLI/STFGNN/blob/a02feee56fbb04d6cabb8f04f625948072fa9583/data/Temporal_Graph_gen.py", "https://github.com/MengzhangLI/STFGNN/blob/a02feee56fbb04d6cabb8f04f625948072fa9583/data/fastDTW_adj_gen.py", "https://github.com/MengzhangLI/STFGNN/blob/a02feee56fbb04d6cabb8f04f625948072fa9583/config/PEMS08/individual_3layer_12T.json", "https://github.com/MengzhangLI/STFGNN/blob/a02feee56fbb04d6cabb8f04f625948072fa9583/data/adj_PEMS08_001.csv", "https://github.com/MengzhangLI/STFGNN/blob/a02feee56fbb04d6cabb8f04f625948072fa9583/README.md"]

[composition]
normalization = "none"
decomposition = "none"
temporal = "local:sliding-4-step-windows+local:gated-dilated-conv+local:temporal-position-embedding"
channel = "component:synchronous_graph_conv+local:dtw-fusion-graph+local:learnable-adjacency-mask+local:spatial-position-embedding"
head = "local:per-horizon-two-layer-fc"
loss = "local:huber"

[data_params]
enc_in = { from = "nodes", rule = "number of graph nodes (sensors)" }
adj_mx = { from = "graph", rule = "[enc_in, enc_in] road graph; binarized and symmetrized into the inner blocks of the 4N fusion graph; required" }
dtw_sparsity = { from = "train-split", rule = "each node is linked to its max(1, floor(enc_in * dtw_sparsity)) nearest nodes by banded DTW on the training split, fitted before the first epoch" }
steps_per_day = { from = "frequency", rule = "samples per day; the training series is cut into whole days for DTW (288 for 5-minute data)" }
num_layers = { from = "seq_len", rule = "each layer shortens the sequence by 3, so seq_len must exceed 3 * num_layers (12 with 3 layers in the paper)" }

[admission]
status = "passed"
date = "2026-10-06"
commit = "72e34a95"
device = "cpu"
reference = "none"
note = ""

[[issues]]
kind = "license"
where = "repository root at `a02feee56fbb04d6cabb8f04f625948072fa9583`"
what = "no license file."
resolution = "recorded as `NOASSERTION`; independent rewrite from the paper with the code read for omissions, nothing copied."

[[issues]]
kind = "code-bug"
where = "`data/Temporal_Graph_gen.py` and `data/fastDTW_adj_gen.py` (`adj[i,:].argsort()[0:top]`, `top = int(N * 0.01)`)"
what = "the node itself (distance 0) is one of the `top` smallest distances, so a node gets `top - 1` temporal neighbors; for PEMS08 (N = 170) `top = 1` gives none, and the shipped `data/adj_PEMS08_001.csv` has off-diagonal entries in only 28 of 170 rows."
resolution = "the node itself is excluded and each node keeps its `max(1, floor(N * dtw_sparsity))` nearest other nodes, then the graph is symmetrized with self-loops."

[[issues]]
kind = "code-bug"
where = "`data/Temporal_Graph_gen.py` `normalize`"
what = "each day is z-scored by its own standard deviation without a guard, so a constant day (a dead sensor) gives NaN distances and that node never gets temporal neighbors."
resolution = "the standard deviation is clamped to 1e-8."

[[issues]]
kind = "paper-error"
where = "Eq. (1) and Alg. 2 lines 5-9"
what = "Eq. (1) takes the minimum over `Mc(i, j - 1)`, `Mc(i - 1, j)` and `Mc(i, j)` (itself) instead of `Mc(i - 1, j - 1)`, and Alg. 2 adds the step costs `M` of the predecessors instead of their cumulative costs `MC`."
resolution = "standard banded DTW on cumulative costs, as in `compute_dtw`."

[[issues]]
kind = "paper-code-mismatch"
where = "Alg. 2 (squared step cost, square root of the total) vs `data/Temporal_Graph_gen.py` (`--order 1`)"
what = "the script defaults to order 1: absolute step costs and no root."
resolution = "`dtw_order = 1` by default; `2` gives Alg. 2."

[[issues]]
kind = "underspecified"
where = "Sec. Spatial-Temporal Fusion Graph Construction"
what = "the series compared by DTW are not defined; the scripts cut the first 60% of the data (the training split) into whole days, z-score every day separately, and treat each node as a 288-step sequence of per-day vectors whose step cost is a norm over days."
resolution = "the same construction on the catalog training split (history span of the training windows only)."

[[issues]]
kind = "paper-code-mismatch"
where = "Sec. STFGN Module (residual connection in every graph multiplication block) vs `models/stsgcn_4n_res.py` `gcn_operation`"
what = "the graph multiplication blocks have no residual connection."
resolution = "follow the code."

[[issues]]
kind = "paper-code-mismatch"
where = "Sec. STFGN Module (crop the middle step `floor(K / 2) = 2`) vs `models/stsgcn_4n_res.py` `stsgcm` (rows `N:2N`)"
what = "the code keeps block 1 of the 4-step window, inherited from STSGCN's 3-step crop."
resolution = "follow the code (`crop = 1`)."

[[issues]]
kind = "paper-code-mismatch"
where = "Fig. 3(b) (temporal connectivity only between proximate steps) vs `utils_4n0_3layer_12T_res.py` `construct_adj_fusion`"
what = "the code also links each node to itself two steps apart (blocks (0, 2), (2, 0), (1, 3), (3, 1) are identities)."
resolution = "follow the code."

[[issues]]
kind = "paper-error"
where = "Sec. Experiments (\"3 STFGNLs, where each contains 8 independent STFGNMs\")"
what = "with T = 12 and K = 4 the layers hold 9, 6 and 3 modules (`T - K + 1` windows), as in `sthgcn_layer_individual`."
resolution = "`T - 3` modules per layer."

[[issues]]
kind = "paper-error"
where = "`README.md` (update of January 2021)"
what = "the authors state that the reported PEMS-BAY, METR-LA, PeMSD7(M) and PeMSD7(L) results are incorrect because a different loss metric was used; only the PEMS03/04/07/08 results stand."
resolution = "compare only on PEMS03/04/07/08."

[[issues]]
kind = "code-bug"
where = "`utils_4n0_3layer_12T_res.py` `get_adjacency_matrix` and `mask_np` (inherited from STSGCN)"
what = "the distance branch tests the builtin `type` instead of `type_` (unreachable), and `mask_np` returns a scalar for a NaN null value; the reported runs use the connectivity graph and `null_val = 0`, so they are unaffected."
resolution = "0/1 connectivity graph; catalog metrics."

[[issues]]
kind = "underspecified"
where = "Sec. Experiments"
what = "initialization, the output-layer width and the learning-rate schedule are not given; the code uses MXNet `Xavier(magnitude = 0.0003)`, width 128, and Adam with squared polynomial decay after a one-epoch warm-up."
resolution = "the code initializer and width; the schedule is a runner setting."
