schema = "tsflab.card/1"
kind = "model"
name = "Basisformer"
tags = ["transformer", "mlp", "attention-variant", "basis-expansion", "interpretable", "normalization", "covariates", "contrastive"]
fits = ["calendar-effects"]
fidelity = "reference-checked"

[paper]
title = "BasisFormer: Attention-based Time Series Forecasting with Learnable and Interpretable Basis"
url = "https://arxiv.org/abs/2310.20496"
venue = "NeurIPS 2023"
year = 2023

[code]
url = "https://github.com/nzl5116190/Basisformer"
revision = "f2f647ec815baa6338111df0545002cc56eab1f0"
license = "NOASSERTION"
reference_sources = ["https://github.com/nzl5116190/Basisformer/blob/f2f647ec815baa6338111df0545002cc56eab1f0/model.py", "https://github.com/nzl5116190/Basisformer/blob/f2f647ec815baa6338111df0545002cc56eab1f0/utils.py", "https://github.com/nzl5116190/Basisformer/blob/f2f647ec815baa6338111df0545002cc56eab1f0/main.py"]

[composition]
normalization = "local:window-standardization"
decomposition = "local:timestamp-learnable-basis"
temporal = "local:bottleneck-mlp-basis-projection"
channel = "local:bidirectional-series-basis-cross-attention"
head = "local:coefficient-weighted-basis-head-fusion"
loss = "loss:mse+local:infonce-coefficient-alignment+local:basis-curvature-smoothness"

[data_params]
enc_in = { from = "channels", rule = "number of input channels" }
heads = { from = "pred_len", rule = "pred_len must be >= heads (the future basis is split into heads chunks of pred_len // heads); d_model >= heads" }
bottleneck = { from = "pred_len", rule = "pred_len must be >= bottleneck" }
timestamp_origin_year = { from = "frequency", rule = "calendar origin of tau (with timestamp_span_years); choose so the dataset's time range maps to a small tau range" }

[admission]
status = "pending"
note = "re-verify: the one-input timestamp-MLP layers are plain linear maps (weight-norm direction underflowed to NaN under weight decay)"

[[issues]]
kind = "paper-code-mismatch"
where = "Sec. 3.3 (`tau = t / T` over the whole series) vs `data_provider/data_loader.py`"
what = "the official loader feeds the window index divided by the number of windows in the current split, so the same timestamp maps to different `tau` in train, validation and test."
resolution = "`tau` is the calendar time of the first history step relative to a fixed origin and span, shared across splits."

[[issues]]
kind = "paper-code-mismatch"
where = "Eq. (7) (squared norm of the second differences) vs `model.py` (`abs(l_smooth).mean()`)"
what = "the official smoothness loss is the mean absolute second difference."
resolution = "the official mean absolute value."

[[issues]]
kind = "license"
where = "repository root"
what = "no license file at the pinned revision."
resolution = "independent rewrite from the paper and the inspected code; license recorded as `NOASSERTION`."

[[issues]]
kind = "code-bug"
where = "`model.py` `map_MLP = MLP_bottle(1, ...)` with `utils.py` `MLP_bottle` (`wn(nn.Linear(input_len, bottleneck))` for `linear1[0]` and `skip`, `input_len = 1`)"
what = "weight normalization of a layer with one input feature makes each weight row `g * v / |v| = g * sign(v)`, so `v` gets no loss gradient. The official AdaBelief has no weight decay, so this is harmless there; under any weight decay `v` shrinks geometrically until `|v|` underflows and the weight becomes NaN (TSFLab ETTh1 pilot, Adam 1e-3, weight decay 1e-4: non-finite training loss)."
resolution = "the two one-input layers are plain linear maps (the same function, initialized as `weight_norm` initializes `g = |v|`); every other projection stays weight-normalized."
