tags = ["attention", "causal", "convolution", "convolutional-attention", "logsparse", "sparse-attention", "local-attention", "restart-attention", "local", "restart", "sparse", "decoder-only", "incremental-decoding", "mask"]
input = "x [batch, length, d_model]; blocked bool [length, length] from logsparse_mask (True = -inf)"
output = "[batch, length, d_model]; forward_last: [batch, 1, d_model] for the newest position from cached keys and values"
