schema = "tsflab.card/1"
kind = "model"
name = "FeTS"
tags = ["cnn", "patching", "frequency", "channel-independent", "normalization", "feature-selection"]
fits = ["long-horizon", "weak-cross-correlation"]
fidelity = "reference-checked"

[paper]
title = "FeTS: A Feature-Aware Framework for Time Series Forecasting"
url = "https://doi.org/10.1609/aaai.v40i31.39838"
venue = "AAAI 2026"
year = 2026

[code]
url = "https://github.com/lllucky111/FeTS"
revision = "d908e434b70f3cf69065004e295db13cdb9790b2"
license = "NOASSERTION"
reference_sources = ["https://github.com/lllucky111/FeTS/blob/d908e434b70f3cf69065004e295db13cdb9790b2/models/FeTS.py"]

[composition]
normalization = "component:revin"
decomposition = "none"
temporal = "local:fourier-poly-mask-adaptive-features+local:local-global-conv-fusion"
channel = "local:channel-independent-shared-weights"
head = "local:flatten-linear-head"
loss = "loss:mse"

[data_params]
enc_in = { from = "channels", rule = "equals the number of channels" }
stride = { from = "seq_len", rule = "at most patch_len; the input is end-padded by replication, so any seq_len is covered" }

[admission]
status = "pending"
reference = "official"
note = "patching changed to end replication padding (head input size changes); re-run tsf model verify FeTS"

[[issues]]
kind = "underspecified"
where = "Eqs. (2)-(14) threshold mask"
what = "the paper's binary threshold mask is non-differentiable and the paper does not say how gradients reach the mask parameters."
resolution = "the exact binary mask in the forward pass with a sigmoid straight-through gradient during training."

[[issues]]
kind = "license"
where = "repository root"
what = "no license file at the pinned revision."
resolution = "independent rewrite; license recorded as `NOASSERTION`."

[[issues]]
kind = "paper-code-mismatch"
where = "models/FeTS.py lines 71-74 (AdaFE.forward)"
what = "official threshold is the mean over the whole batch tensor with a strict `>`; paper Eqs. (7)-(8) use the per-row mean mu_Z[r] with `>=`."
resolution = "follows the paper: per-row mean and `>=`."

[[issues]]
kind = "paper-code-mismatch"
where = "models/FeTS.py lines 92-120 and 178-188 (DSFFN, Model.forward)"
what = "official DSFFN uses a pointwise expansion conv (d_model * ffn_ratio), a combine conv and a pointwise output conv, and adds the patch embedding residually after DSFFN; paper Eqs. (10)-(14) give a K-sized local conv, fusion conv and output conv with no residual."
resolution = "not changed in this fix: TSFLab keeps a k=3 local conv, a 1x1 fusion conv, GELU + dropout in place of the Eq. (14) output conv, and a residual tokens + AdaFE before LayerNorm; recorded in README Differences."
